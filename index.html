<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#3b82f6;
  --cyan:#06b6d4;
  --green:#10b981;
  --dark:#020617;
  --card:#0f172a;
  --card2:#0c1628;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:rgba(255,255,255,0.07);
  --glow-blue:rgba(59,130,246,0.4);
  --glow-cyan:rgba(6,182,212,0.4);
}
body{background:var(--dark);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}

/* ── Background grid + gradient ── */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(6,182,212,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(6,182,212,0.03) 1px,transparent 1px);
  background-size:60px 60px;
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(6,182,212,0.08) 0%,transparent 60%),
              radial-gradient(ellipse 60% 40% at 80% 80%,rgba(59,130,246,0.06) 0%,transparent 50%);
  pointer-events:none;z-index:0;
}

/* ── Particles ── */
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;}
.particle{position:absolute;border-radius:50%;animation:float linear infinite;opacity:0.12;}

/* ── Keyframes ── */
@keyframes float{0%{transform:translateY(100vh) rotate(0deg);opacity:0;}10%{opacity:0.12;}90%{opacity:0.12;}100%{transform:translateY(-100px) rotate(720deg);opacity:0;}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(6,182,212,0.5);}70%{box-shadow:0 0 0 10px rgba(6,182,212,0);}100%{box-shadow:0 0 0 0 rgba(6,182,212,0);}}
@keyframes slideIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideInRight{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(6,182,212,0.2),0 0 40px rgba(59,130,246,0.1);}50%{box-shadow:0 0 40px rgba(6,182,212,0.4),0 0 80px rgba(59,130,246,0.2);}}
@keyframes shimmer{0%{background-position:-200% center;}100%{background-position:200% center;}}
@keyframes progressFill{from{width:0%;}to{width:89%;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

/* ── Layout ── */
.hero{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;}
.container{max-width:1120px;width:100%;margin:0 auto;}

/* ── Brand bar ── */
.brand-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px;animation:slideIn 0.5s ease;}
.brand-left{display:flex;flex-direction:column;}
.brand-name{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:var(--text);letter-spacing:-0.3px;}
.brand-name span{color:var(--cyan);}
.brand-tagline{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:0.3px;}
.live-pill{display:flex;align-items:center;gap:8px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#f87171;padding:7px 16px;border-radius:50px;font-size:12px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
.live-dot{width:8px;height:8px;background:#ef4444;border-radius:50%;animation:pulse 1s ease infinite;}

/* ── Badge ── */
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.25);color:var(--green);padding:8px 20px;border-radius:50px;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:28px;animation:slideIn 0.6s ease;}
.badge-dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 1.5s ease infinite;}

/* ── Headline ── */
.headline{font-family:'Space Grotesk',sans-serif;font-size:clamp(46px,7.5vw,88px);font-weight:900;line-height:0.93;margin-bottom:24px;animation:slideIn 0.7s ease;}
.headline .line1{display:block;background:linear-gradient(135deg,#fff 0%,#93c5fd 40%,#67e8f9 70%,#fff 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite;}
.headline .line2{display:block;color:var(--cyan);text-shadow:0 0 50px rgba(6,182,212,0.5);}

/* ── Subhead ── */
.subhead{font-size:clamp(15px,2.2vw,19px);color:var(--muted);max-width:560px;line-height:1.75;margin-bottom:44px;animation:slideIn 0.8s ease;}
.subhead span{color:var(--cyan);font-weight:600;}

/* ── Main grid ── */
.main-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:36px;align-items:start;animation:slideIn 0.9s ease;}
.left-col{display:flex;flex-direction:column;gap:24px;}
.right-col{display:flex;flex-direction:column;gap:20px;animation:slideInRight 0.9s ease;}

/* ── Cards ── */
.card{background:rgba(12,22,40,0.85);border:1px solid var(--border);border-radius:20px;padding:28px;backdrop-filter:blur(12px);transition:border-color 0.3s,transform 0.2s;}
.card:hover{border-color:rgba(6,182,212,0.2);transform:translateY(-2px);}
.card-title{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:20px;display:flex;align-items:center;gap:8px;}
.card-title::before{content:'';width:20px;height:2px;background:var(--cyan);border-radius:1px;}

/* ── Feature items ── */
.feature-item{display:flex;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.feature-item:last-child{border-bottom:none;padding-bottom:0;}
.feature-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.feature-icon.blue{background:rgba(59,130,246,0.12);color:var(--blue);}
.feature-icon.cyan{background:rgba(6,182,212,0.12);color:var(--cyan);}
.feature-icon.green{background:rgba(16,185,129,0.12);color:var(--green);}
.feature-icon.purple{background:rgba(139,92,246,0.12);color:#a78bfa;}
.feature-text strong{display:block;color:var(--text);font-size:15px;font-weight:600;margin-bottom:3px;}
.feature-text span{color:var(--muted);font-size:13px;line-height:1.5;}

/* ── Bonus card ── */
.bonus-card{background:linear-gradient(135deg,rgba(6,182,212,0.06),rgba(59,130,246,0.08));border:1px solid rgba(6,182,212,0.2);border-radius:16px;padding:18px 22px;display:flex;align-items:center;gap:14px;}
.bonus-badge{background:linear-gradient(90deg,var(--cyan),var(--blue));color:#000;font-size:10px;font-weight:900;letter-spacing:1.5px;padding:5px 12px;border-radius:8px;text-transform:uppercase;flex-shrink:0;}
.bonus-text{color:var(--text);font-size:14px;font-weight:500;line-height:1.5;}

/* ── Event card (right) ── */
.event-card{background:rgba(12,22,40,0.92);border:1px solid rgba(6,182,212,0.18);border-radius:22px;padding:28px;backdrop-filter:blur(12px);animation:glow 4s ease infinite;}
.event-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,0.05);}
.event-header-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--text);}
.event-header-badge{background:rgba(6,182,212,0.1);border:1px solid rgba(6,182,212,0.25);color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:1px;padding:4px 12px;border-radius:20px;text-transform:uppercase;}
.event-stat{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.event-stat:last-of-type{border-bottom:none;}
.event-stat-icon{width:46px;height:46px;background:rgba(6,182,212,0.1);border:1px solid rgba(6,182,212,0.15);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--cyan);font-size:18px;flex-shrink:0;}
.event-stat-info label{display:block;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.event-stat-info strong{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--text);}

/* ── Countdown ── */
.countdown-section{text-align:center;padding:22px 0 10px;border-top:1px solid rgba(255,255,255,0.05);margin-top:14px;}
.countdown-label{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}
.countdown-boxes{display:flex;justify-content:center;gap:10px;}
.cbox{background:rgba(6,182,212,0.07);border:1px solid rgba(6,182,212,0.18);border-radius:14px;padding:14px 16px;min-width:64px;text-align:center;}
.cbox-num{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:900;color:var(--cyan);line-height:1;}
.cbox-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:5px;}

/* ── Register card ── */
