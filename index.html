<title>AI Career Transition Workshop - code2career_ai</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --cyan: #22d3ee;
  --blue: #3b82f6;
  --green: #10b981;
  --dark: #020617;
  --card: rgba(15, 23, 42, 0.4);
  --border: rgba(255, 255, 255, 0.06);
  --text: #f8fafc;
  --muted: #64748b;
  --glow-cyan: rgba(34, 211, 238, 0.15);
}
body{
  background: var(--dark);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  padding-top: 72px; /* Smooth padding headroom offset to hold the fixed top banner track */
}
/* Premium subtle layout grid lines overlay matrix */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to right,#1e293b_1px,transparent_1px),linear-gradient(to bottom,#1e293b_1px,transparent_1px);
  background-size: 4rem 4rem;
  mask-image: radial-gradient(ellipse 60% 50% at 50% 0%, #000 70%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 0%, #000 70%, transparent 100%);
  opacity: 0.12;
  pointer-events: none;
  z-index: 0;
}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;}
.particle{position:absolute;border-radius:50%;animation:float linear infinite;opacity:0.1;}
@keyframes float{0%{transform:translateY(100vh) rotate(0deg);opacity:0;}10%{opacity:0.1;}90%{opacity:0.1;}100%{transform:translateY(-100px) rotate(720deg);opacity:0;}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
@keyframes slideIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes shadowPulse{0%,100%{box-shadow:0 0 30px var(--glow-cyan); border-color: rgba(34, 211, 238, 0.35);}50%{box-shadow:0 0 50px rgba(34, 211, 238, 0.4), 0 0 80px rgba(34, 211, 238, 0.15); border-color: rgba(34, 211, 238, 0.6);}}
@keyframes shimmer{0%{background-position:-200% center;}100%{background-position:200% center;}}

/* ========================================== */
/* ULTRA-MODERN FIXED TOP COUNTDOWN CONSOLE   */
/* ========================================== */
.top-ticker-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 72px;
  background: rgba(2, 6, 23, 0.75);
  border-b: 1px solid var(--border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 1000;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--border);
}
.ticker-container {
  max-w: 1200px;
  width: 100%;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ticker-status-node {
  display: flex;
  align-items: center;
  gap: 12px;
}
.live-signal-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(34, 211, 238, 0.08);
  border: 1px solid rgba(34, 211, 238, 0.2);
  color: var(--cyan);
  padding: 6px 14px;
  border-radius: 8px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
}
.live-signal-dot {
  width: 6px;
  height: 6px;
  background: var(--cyan);
  border-radius: 50%;
  position: relative;
}
.live-signal-dot::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--cyan);
  border-radius: 50%;
  animation: pulse 1.2s ease infinite;
  transform: scale(3);
  opacity: 0.3;
}
.ticker-callout-text {
  font-size: 13px;
  color: #e2e8f0;
  font-weight: 500;
}
.ticker-callout-text span {
  color: var(--cyan);
  font-weight: 700;
}
.ticker-timer-mesh {
  display: flex;
  align-items: center;
  gap: 6px;
}
.ticker-timer-mesh .timer-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--muted);
  letter-spacing: 1.5px;
  margin-right: 6px;
}
.ticker-cbox {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 8px;
  padding: 4px 10px;
  min-width: 52px;
  text-align: center;
}
.ticker-cbox-num {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.2;
}
.ticker-cbox-lbl {
  font-size: 8px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
}

/* ========================================== */
/* CONTENT ARCHITECTURE FRAMES                */
/* ========================================== */
.hero{position:relative;z-index:1;padding:60px 24px;}
.container{max-width:1200px;width:100%;margin:0 auto;}
.brand-block {margin-bottom:40px; animation:slideIn 0.5s ease;}
.brand-name{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:900;letter-spacing:-0.5px;color:var(--text);}
.brand-name span{text-shadow: 0 0 15px rgba(34, 211, 238, 0.3); background:linear-gradient(to right, var(--cyan), #3b82f6); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
.brand-tagline{font-size:12px;font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--muted);margin-top:2px;letter-spacing:1px;text-transform:uppercase;}

.badge-wrapper {animation:slideIn 0.6s ease;}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.2);color:var(--green);padding:8px 18px;border-radius:50px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:24px;}
.badge-dot{width:6px;height:6px;background:var(--green);border-radius:50%;}

.headline{font-family:'Space Grotesk',sans-serif;font-size:clamp(42px,7vw,80px);font-weight:900;line-height:0.95;margin-bottom:24px;animation:slideIn 0.7s ease;letter-spacing:-2.5px;}
.headline .line1{display:block;background:linear-gradient(135deg,#fff 0%,#cbd5e1 50%,#fff 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite;}
.headline .line2{display:block;color:transparent;background: linear-gradient(135deg, var(--cyan), var(--blue)); -webkit-background-clip: text;}

.subhead{font-size:clamp(16px,2.2vw,19px);color:#94a3b8;max-width:680px;line-height:1.65;margin-bottom:56px;animation:slideIn 0.8s ease;}
.subhead span{color:var(--cyan);font-weight:700;}

/* HIGH CONVERTING COLUMN DISTRIBUTION MATRIX */
.main-grid{display:grid;grid-template-columns:0.9fr 1.1fr;gap:48px;align-items:start;animation:slideIn 0.9s ease;}
.left-col{display:flex;flex-direction:column;gap:24px;position:sticky;top:112px;}
.right-col{display:flex;flex-direction:column;gap:32px;}

.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:36px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:all 0.3s ease;box-shadow: 0 10px 40px rgba(0,0,0,0.3);}
.card:hover{border-color:rgba(255,255,255,0.12);background:rgba(30, 41, 59, 0.45);}
.card-title{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#64748b;margin-bottom:24px;display:flex;align-items:center;gap:8px;}
.card-title::before{content:'//';color:var(--cyan);}

.feature-item{display:flex;align-items:start;gap:20px;padding:20px 0;border-bottom:1px solid var(--border);}
.feature-item:last-child{border-bottom:none;padding-bottom:0;}
.feature-item:first-child{padding-top:0;}
.feature-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:1px solid rgba(255,255,255,0.03);}
.feature-icon.blue{background:rgba(59,130,246,0.12);color:var(--blue);border-color:rgba(59,130,246,0.2);}
.feature-icon.green{background:rgba(16,185,129,0.12);color:var(--green);border-color:rgba(16,185,129,0.2);}
.feature-icon.purple{background:rgba(139,92,246,0.12);color:#a78bfa;border-color:rgba(139,92,246,0.2);}
